<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap");

      :root {
        --bg-color: #f4f0e6;
        --border-color: #000000;
        --shadow-color: #000000;
        --user-msg: #ff90e8;
        --ai-msg: #ffffff;
        --accent: #ffeb3b;
        --btn-color: #00e5ff;
        --text: #000000;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Space Mono", monospace;
      }

      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(circle, #000 1px, transparent 1px);
        background-size: 20px 20px;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* Main Container */
      .app-container {
        width: 100%;
        max-width: 900px;
        height: 85vh;
        background: #ffffff;
        border: 4px solid var(--border-color);
        box-shadow: 12px 12px 0px var(--shadow-color);
        display: flex;
        flex-direction: column;
        z-index: 1;
        position: relative;
      }

      /* Header */
      .header {
        padding: 20px;
        border-bottom: 4px solid var(--border-color);
        background: var(--accent);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      /* Chat Area */
      .chat-container {
        flex: 1;
        padding: 30px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: #ffffff;
      }

      /* Scrollbar */
      .chat-container::-webkit-scrollbar {
        width: 12px;
      }
      .chat-container::-webkit-scrollbar-track {
        background: #ffffff;
        border-left: 4px solid #000;
      }
      .chat-container::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-left: 4px solid #000;
        border-bottom: 4px solid #000;
      }

      .message {
        max-width: 80%;
        padding: 15px 20px;
        border: 3px solid var(--border-color);
        box-shadow: 5px 5px 0px var(--shadow-color);
        line-height: 1.5;
        font-size: 1rem;
        font-weight: 700;
        position: relative;
      }

      .message.human {
        align-self: flex-end;
        background: var(--user-msg);
      }

      .message.ai {
        align-self: flex-start;
        background: var(--ai-msg);
      }

      .message.system {
        align-self: center;
        background: #000;
        color: #fff;
        padding: 8px 15px;
        box-shadow: 4px 4px 0px var(--accent);
        font-size: 0.85rem;
        text-transform: uppercase;
        max-width: 90%;
        text-align: center;
      }

      /* Input Area */
      .input-area {
        padding: 20px;
        border-top: 4px solid var(--border-color);
        background: #ffffff;
        display: flex;
        gap: 15px;
      }

      .chat-input {
        flex: 1;
        background: #ffffff;
        border: 4px solid var(--border-color);
        box-shadow: 4px 4px 0px var(--shadow-color);
        padding: 15px 20px;
        color: var(--text);
        font-size: 1rem;
        font-weight: 700;
        outline: none;
        transition: all 0.1s ease;
      }

      .chat-input:focus {
        box-shadow: 6px 6px 0px var(--accent);
        transform: translate(-2px, -2px);
      }

      .send-btn {
        background: var(--btn-color);
        color: #000;
        border: 4px solid var(--border-color);
        box-shadow: 4px 4px 0px var(--shadow-color);
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.1s ease;
      }

      .send-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px var(--shadow-color);
      }

      .send-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px var(--shadow-color);
        background: var(--accent);
      }

      .send-btn svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: #000;
        stroke-width: 3;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }

      /* Typing Indicator */
      .typing-indicator {
        display: none;
        align-self: flex-start;
        background: var(--ai-msg);
        border: 3px solid var(--border-color);
        box-shadow: 5px 5px 0px var(--shadow-color);
        padding: 15px 20px;
        gap: 8px;
        align-items: center;
      }

      .typing-indicator.active {
        display: flex;
      }

      .block {
        width: 12px;
        height: 12px;
        background: #000;
        animation: blink 1s infinite step-end;
      }

      .block:nth-child(2) {
        animation-delay: 0.2s;
      }
      .block:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* Decorational elements for brutalism */
      .badge {
        position: absolute;
        top: -15px;
        right: -15px;
        background: #ff3b3b;
        color: #fff;
        border: 3px solid #000;
        padding: 5px 10px;
        font-weight: bold;
        transform: rotate(10deg);
        box-shadow: 3px 3px 0px #000;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="badge">V1.0</div>
      <header class="header">
        <h1>[ TERMINAL / GROQ ]</h1>
      </header>

      <div class="chat-container" id="chatContainer">
        <div class="message system">SYS.INIT: YOU ARE A FUNNY AI ASSISTANT</div>

        <div class="typing-indicator" id="typingIndicator">
          <div class="block"></div>
          <div class="block"></div>
          <div class="block"></div>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          class="chat-input"
          placeholder="INPUT COMMAND..."
          autocomplete="off"
        />
        <button id="sendBtn" class="send-btn">
          <svg viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Script -->
    <script>
      const chatContainer = document.getElementById("chatContainer");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      const typingIndicator = document.getElementById("typingIndicator");

      let messages = [
        { role: "system", content: "You are funny AI Assistant." },
      ];

      function addMessageToUI(content, role) {
        const msgDiv = document.createElement("div");
        const roleClass =
          role === "user" ? "human" : role === "assistant" ? "ai" : "system";
        msgDiv.classList.add("message", roleClass);
        msgDiv.textContent = content;

        chatContainer.insertBefore(msgDiv, typingIndicator);
        scrollToBottom();
      }

      function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function setTyping(isTyping) {
        if (isTyping) {
          typingIndicator.classList.add("active");
          scrollToBottom();
        } else {
          typingIndicator.classList.remove("active");
        }
      }

      async function handleSend() {
        const question = messageInput.value.trim();
        const apiKey = ""; // Hardcoded from .env

        if (!question) return;

        messageInput.value = "";
        addMessageToUI(question, "user");
        messages.push({ role: "user", content: question });

        setTyping(true);

        try {
          const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${apiKey}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: messages,
                temperature: 0.7,
              }),
            },
          );

          if (!response.ok) {
            throw new Error(`API error: ${response.status}`);
          }

          const data = await response.json();
          const aiContent = data.choices[0].message.content;

          messages.push({ role: "assistant", content: aiContent });
          addMessageToUI(aiContent, "assistant");
        } catch (error) {
          console.error(error);
          addMessageToUI("ERROR: CONNECTION FAILED.", "system");
          messages.pop();
        } finally {
          setTyping(false);
        }
      }

      sendBtn.addEventListener("click", handleSend);

      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSend();
        }
      });

      messageInput.focus();
    </script>
  </body>
</html>
